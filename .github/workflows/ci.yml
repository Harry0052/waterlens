name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt --require-hashes

      - name: Install WaterLens
        run: python -m pip install -e . --no-deps

      - name: Test
        run: python -m pytest

      - name: Demo
        run: python -m waterlens demo --output out/demo

      - name: Check the frozen persistence score
        run: |
          python -c "import json; report=json.load(open('out/demo/score.json')); persistence=report['detectors']['persistence']; assert persistence['precision']==0.5; assert persistence['recall']==0.5; assert persistence['median_delay_minutes']==15; assert persistence['false_alerts_per_eligible_household_day']==1"

      - name: Upload the demo report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-report
          path: |
            out/demo/report.html
            out/demo/summary.txt
            out/demo/score.json
          if-no-files-found: error
          retention-days: 14
